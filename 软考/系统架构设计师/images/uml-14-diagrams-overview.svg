<svg viewBox="0 0 680 720" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>UML 2.x 十四种图分类总览</title>
<desc>按建模用途将 UML 14 种图分为四类：需求建模（用例图）、静态建模（类图、对象图、包图）、动态建模（顺序图、通信图、定时图、状态图、活动图、交互概览图）、物理建模（构件图、部署图、制品图、组合结构图），每种图配有最小识别符号。</desc>
